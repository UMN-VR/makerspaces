<!doctype html>
<html lang="en" data-ui-theme="umn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="description" content="An unlisted prototype tour of University of Minnesota makerspaces, with a 360° visit to the Toaster Innovation Hub and a directory of campus spaces." />
    <title>UMN makerspaces · tour prototype</title>
  </head>
  <body>
    <header class="makers-header">
      <div class="makers-identity"><strong>Makerspaces</strong><span class="prototype-label">Prototype</span></div>
      <span class="makers-location" id="current-space">The Toaster · 360°</span>
      <nav aria-label="Tour controls">
        <button class="makers-button" id="panorama-button" type="button">360° tour</button>
        <button class="makers-button is-primary" id="directory-button" type="button" aria-expanded="false" aria-controls="spaces-panel">Spaces</button>
        <a class="source-link" href="https://github.com/UMN-VR/makerspaces" target="_blank" rel="noopener noreferrer">Source ↗</a>
      </nav>
    </header>
    <main id="root" aria-label="Makerspace 360° tour"></main>
    <section class="spaces-panel" id="spaces-panel" aria-label="Makerspace directory" hidden>
      <div class="panel-heading"><div><p class="eyebrow">University of Minnesota</p><h1>Find your space</h1></div><button class="makers-icon-button" id="close-directory" type="button" aria-label="Close spaces">×</button></div>
      <div id="directory-content"><p class="directory-message" role="status">Loading spaces…</p></div>
      <p class="directory-footer">A working prototype. Check each space’s website for access, training and current hours. <a href="https://makers.umn.edu/" target="_blank" rel="noopener noreferrer">makers.umn.edu ↗</a></p>
    </section>
    <div class="tour-state" id="tour-state" role="status">Opening the Toaster 360°…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
