<!doctype html>
<html lang="en" data-ui-theme="umn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="description" content="An unlisted prototype tour of University of Minnesota makerspaces, with a 360° visit to the Toaster Innovation Hub and a directory of campus spaces." />
    <title>UMN makerspaces · tour prototype</title>
  </head>
  <body>
    <main id="root" aria-label="Makerspace 360° tour"></main>
    <template id="makerspaces-content">
      <section class="makerspaces-tab" aria-label="Makerspace directory">
        <p class="directory-intro">Explore University of Minnesota makerspaces. Prototype.</p>
        <div class="space-actions">
          <button class="makers-button is-primary" id="panorama-button" type="button" disabled>Toaster 360°</button>
          <span id="current-space" class="current-space">The Toaster · 360°</span>
        </div>
        <p id="tour-state" role="status">Opening the Toaster 360°…</p>
        <div id="directory-content"><p class="directory-message" role="status">Loading spaces…</p></div>
        <p class="directory-footer">Check each space’s website for access, training and current hours. <a href="https://makers.umn.edu/" target="_blank" rel="noopener noreferrer">makers.umn.edu ↗</a> · <a href="https://github.com/UMN-VR/makerspaces" target="_blank" rel="noopener noreferrer">Source ↗</a></p>
      </section>
    </template>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
